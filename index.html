<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoHub: Адаптивный шифратор</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme"> <div class="container">
    <div class="header">
        <h1>CryptoHub</h1>
        <button id="themeToggle" onclick="toggleTheme()">🌙 Темная тема</button>
    </div>
    
    <div class="main-layout">
        <div class="input-section">
            <label>Исходный текст:</label>
            <textarea id="inputText" placeholder="Введите текст..."></textarea>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Выберите шифр:</label>
                <select id="cipherSelect" onchange="updateUI()">
                    <option value="caesar">Шифр Цезаря</option>
                    <option value="morse">Азбука Морзе</option>
                    <option value="atbash">Шифр Атбаша</option>
                    <option value="vigenere">Шифр Виженера</option>
                    <option value="gronsfeld">Шифр Гронсфельда</option>
                    <option value="hill">Шифр Хилла</option>
                </select>
            </div>

            <div id="extraSettings" class="control-group">
                <div id="shiftWrap">
                    <label>Сдвиг:</label>
                    <input type="number" id="shiftInput" value="3">
                </div>
                <div id="keyWrap" style="display:none;">
                    <label>Ключ:</label>
                    <input type="text" id="keyInput" placeholder="Ключ...">
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn encrypt-btn" onclick="process(true)">Зашифровать</button>
            <button class="btn decrypt-btn" onclick="process(false)">Расшифровать</button>
        </div>

        <div class="output-section">
            <label>Результат:</label>
            <textarea id="outputText" readonly></textarea>
        </div>

        <div id="matrixDisplay" class="matrix-container">
            <strong>Матрица / Таблица ключа:</strong>
            <div id="matrixContent"></div>
        </div>
    </div>
</div>

<script src="crypto.js"></script>
</body>
</html>
