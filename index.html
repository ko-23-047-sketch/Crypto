<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CryptoHub: Шифрование</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h1 { color: #333; text-align: center; }
        textarea { width: 100%; height: 100px; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; resize: none; box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        select, input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        .buttons { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .encrypt-btn { background: #4CAF50; }
        .decrypt-btn { background: #2196F3; }
        .matrix-container { margin-top: 20px; padding: 15px; background: #eee; border-radius: 5px; display: none; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h1>CryptoHub</h1>
    
    <label>Исходный текст:</label>
    <textarea id="inputText" placeholder="Введите текст..."></textarea>

    <div class="controls">
        <select id="cipherSelect" onchange="toggleSettings()">
            <option value="caesar">Шифр Цезаря</option>
            <option value="morse">Азбука Морзе</option>
            <option value="atbash">Шифр Атбаша</option>
            <option value="vigenere">Шифр Виженера</option>
            <option value="bacon">Шифр Бэкона</option>
            <option value="gronsfeld">Шифр Гронсфельда</option>
            <option value="polybius">Квадрат Полибия</option>
            <option value="playfair">Шифр Плейфера</option>
            <option value="hill">Шифр Хилла</option>
        </select>

        <div id="extraSettings">
            <input type="number" id="shiftInput" placeholder="Сдвиг" value="3">
            <input type="text" id="keyInput" placeholder="Ключ (текст/цифры)" style="display:none;">
        </div>
    </div>

    <div class="buttons">
        <button class="encrypt-btn" onclick="process(true)">Зашифровать</button>
        <button class="decrypt-btn" onclick="process(false)">Расшифровать</button>
    </div>

    <label>Результат:</label>
    <textarea id="outputText" readonly></textarea>

    <div id="matrixDisplay" class="matrix-container">
        <strong>Визуализация (матрица/таблица):</strong>
        <div id="matrixContent"></div>
    </div>
</div>

<script src="crypto.js"></script>
</body>
</html>
